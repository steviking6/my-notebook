[project]
name = "my-notebook-backend"
version = "0.1.0"
description = "RAG API for My Notebook: ingestion, hybrid retrieval with RRF, reranking and grounded answers."
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "unstructured[docx,md,pdf,pptx]>=0.27",
    "qdrant-client[fastembed]>=1.20.0",
    "openai>=3.50.0",
    "flashrank>=0.2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# unstructured[pdf] pulls unstructured-inference, which declares torch, transformers,
# OpenCV... (~2 GB) for the "hi_res" strategy (OCR + layout model). We only use
# strategy="fast": it imports a few unstructured-inference modules that need numpy only.
# A marker that never matches removes these packages from the install (smaller Docker
# image, faster Cloud Run cold start). tests/test_ingestion.py checks PDFs still parse.
[tool.uv]
override-dependencies = [
    "torch; sys_platform == 'never'",
    "torchvision; sys_platform == 'never'",
    "timm; sys_platform == 'never'",
    "accelerate; sys_platform == 'never'",
    "transformers; sys_platform == 'never'",
    "opencv-python; sys_platform == 'never'",
]
