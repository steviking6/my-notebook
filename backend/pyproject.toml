[project]
name = "my-notebook-backend"
version = "0.1.0"
description = "RAG API for My Notebook: ingestion, hybrid retrieval with RRF, reranking and grounded answers."
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "unstructured[docx,md,pdf,pptx]>=0.27",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "qdrant-client[fastembed]>=1.20.0",
    "openai>=3.50.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# PyTorch (pulled by unstructured[pdf]) defaults to CUDA wheels (several GB).
# We only run on CPU (local + Cloud Run), so we force the CPU-only build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
