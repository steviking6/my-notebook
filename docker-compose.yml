# Local development services.
# Usage: docker compose up -d
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: my-notebook-qdrant
    ports:
      - "6333:6333"   # REST API + web dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage   # keeps vectors when the container restarts
    restart: unless-stopped

volumes:
  qdrant_storage:
